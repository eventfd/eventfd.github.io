{{- $id := .Inner | sha256 | printf "code-%.12ss" -}}
{{- $langName := index site.Data.languages .Type | default .Type -}}
{{- $result := transform.HighlightCodeBlock . -}}

<div id="{{ $id }}" class="code-block">
  <div class="code-header">
    <!-- ... existing header ... -->
    <span class="code-lang">
      {{- with .Attributes.title | default ($langName | default "text") -}}
      {{ . }}
      {{ end }}
    </span>
    <pre style="display: none;">{{.Inner}}</pre>
    <button class="copy-code-button">
      <svg xmlns="http://www.w3.org/2000/svg"
        width="20px" height="20px"
        transform="translate(0, 3)"
        viewBox="0 -960 960 960"
        fill="currentColor">
        <path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/>
      </svg>
    </button>
  </div>

  {{- $result.Wrapped -}}

  <style>
    {{- /* 1. Height Scoping */ -}}
    {{- with .Attributes.height -}}
    #{{ $id }} .highlight pre { max-height: {{ . | safeCSS }}; overflow-y: auto; }
    {{- end -}}

    {{- /* 2. Dynamic Color Highlighting */ -}}
    {{- range $key, $value := .Attributes -}}
      {{- if (hasPrefix $key "hl_") -}}
        {{- /* Extract color and check if it's a hex code (3 or 6 chars) */ -}}
        {{- $color := strings.TrimPrefix "hl_" $key -}}
        {{- if (findRE "^[0-9a-fA-F]{3,6}$" $color) -}}
          {{- $color = printf "#%s" $color -}}
        {{- end -}}

        {{- /* Parse line ranges (e.g., "1, 3-5") */ -}}
        {{- $groups := split (replace $value " " "") "," -}}
        {{- range $groups -}}
          {{- if (findRE `\d+-\d+` .) -}}
            {{- $range := split . "-" -}}
            {{- range (seq (index $range 0 | int) (index $range 1 | int)) -}}
              #{{ $id }} .highlight .line:nth-child({{ . }}) { background-color: {{ $color | safeCSS }} !important; display: block; }
            {{- end -}}
          {{- else if . -}}
            #{{ $id }} .highlight .line:nth-child({{ . | int }}) { background-color: {{ $color | safeCSS }} !important; display: block; }
          {{- end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  </style>
</div>
