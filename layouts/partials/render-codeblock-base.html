{{- $id := .Inner | sha256 | printf "code-%.12ss" -}}
{{- $result := transform.HighlightCodeBlock . -}}

<div id="{{ $id }}" class="code-block">
  <div class="code-header">
    <!-- ... existing header ... -->
  </div>

  {{- $result.Wrapped -}}

  <style>
    {{- /* 1. Height Scoping */ -}}
    {{- with .Attributes.height -}}
    #{{ $id }} .highlight pre { max-height: {{ . | safeCSS }}; overflow-y: auto; }
    {{- end -}}

    {{- /* 2. Dynamic Color Highlighting */ -}}
    {{- range $key, $value := .Attributes -}}
      {{- if (hasPrefix $key "hl_") -}}
        {{- /* Extract color and check if it's a hex code (3 or 6 chars) */ -}}
        {{- $color := strings.TrimPrefix "hl_" $key -}}
        {{- if (findRE "^[0-9a-fA-F]{3,6}$" $color) -}}
          {{- $color = printf "#%s" $color -}}
        {{- end -}}

        {{- /* Parse line ranges (e.g., "1, 3-5") */ -}}
        {{- $groups := split (replace $value " " "") "," -}}
        {{- range $groups -}}
          {{- if (findRE `\d+-\d+` .) -}}
            {{- $range := split . "-" -}}
            {{- range (seq (index $range 0 | int) (index $range 1 | int)) -}}
              #{{ $id }} .highlight .line:nth-child({{ . }}) { background-color: {{ $color | safeCSS }} !important; display: block; }
            {{- end -}}
          {{- else if . -}}
            #{{ $id }} .highlight .line:nth-child({{ . | int }}) { background-color: {{ $color | safeCSS }} !important; display: block; }
          {{- end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  </style>
</div>
