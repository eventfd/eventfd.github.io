baseURL = "https://eventfd.github.io"
languageCode = "en-us"
title = "Suvaditya Sur"
theme = "typo"

[params]
description = "eventfd"
disableSocialMeta = true
theme = "auto"
colorPalette = "default"
singleDateFormat = "2 Jan 2006"
hideHeader = false
homeIntroTitle = "Hi!"
homeIntroContent = """
I'm a **Software Engineer** with a strong foundation in computer science and a love for problem-solving. My interests include algorithms, compiler design, operating systems, and functional programming—especially **Haskell**. I enjoy understanding systems from first principles and exploring how high-level abstractions map to real machines.

I'm motivated by the challenge of breaking complex systems down until they're simple enough to truly understand. This blog is where I share things I'm learning or experimenting with, as well as notes from challenges and projects that catch my interest.

In case you're wondering about eventfd; it's a linux syscall - [`man 2 eventfd`](https://man7.org/linux/man-pages/man2/eventfd.2.html)

## Talks
-  [`Reversing Go and Rust binaries`](https://youtu.be/pDmpiv_sygA?t=4001&si=t2NYjm9YZdR4L10l) &mdash; DC9111 0x04 2021 organized by [Defcon Delhi](https://x.com/dc_9111)

### Achievements (Summary)
- AIR 145 — GATE CS 2021
- Top 20 globally in Flare-On
- Rank 7 globally in Decompetition

[See full list →](/achievements/)

"""
# Collection to display on home
homeCollectionTitle = ""
homeCollection = ""

# Lists parameters
paginationSize = 5
listSummaries = true
listDateFormat = "02 Jan 2006"
showFooter = true

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "~"

# Social icons
[[params.social]]
name = "leetcode"
url = "https://leetcode.com/eventfd"

