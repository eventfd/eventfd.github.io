name = "github"
url = "https://github.com/eventfd"

# Main menu pages

[[params.menu]]
name = "articles"
url = "/articles"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "notes"
url = "/notes"

[[params.menu]]
name = "tags"
