[params]
description = "eventfd"
disableSocialMeta = true
theme = "light"
colorPalette = "default"
singleDateFormat = "2 Jan 2006"
hideHeader = false
homeIntroTitle = "Hi!"
homeIntroContent = """
I'm a **Software Engineer** with a strong foundation in computer science and a love for problem-solving. My interests include algorithms, compiler design, operating systems, and functional programming—especially **Haskell**. I enjoy understanding systems from first principles and exploring how high-level abstractions map to real machines.

I'm motivated by the challenge of breaking complex systems down until they're simple enough to truly understand.

This blog is where I share things I'm learning or experimenting with, as well as notes from challenges and projects that catch my interest.

## Achievements

Over the years, I've participated in a variety of competitions and challenges that combine problem-solving, systems, and security:

### Competitive Exams
- AIR 145 &mdash; GATE CS 2021

### CTFs & Security Challenges
- Rank 1 &mdash; InCTF 2019
- Rank 7 &mdash; [Decompetition 2021](https://web.archive.org/web/20210925112333/https://decompetition.io/teams?scores=official)
- Rank 14 &mdash; [Flare-On 2021](https://flare-on.com/2021.html)
- Rank 2 &mdash; [Malwarebytes CTF 2021](https://www.malwarebytes.com/blog/threat-intel/2021/10/the-return-of-the-malwarebytes-crackme)
- Rank 7 &mdash; [Decompetition 2022](https://web.archive.org/web/20240623151242/https://decompetition.io/scoreboard?scores=official)
- Rank 41 &mdash; [Flare-On 2022](https://flare-on.com/2022.html)
- Rank 16 &mdash; [Flare-On 2023](https://flare-on.com/2023.html)
"""
# Collection to display on home
homeCollectionTitle = ""
homeCollection = ""

# Lists parameters
paginationSize = 5
listSummaries = true
listDateFormat = "2 Jan 2006"

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "~"

# Social icons
[[params.social]]
name = "leetcode"
url = "https://leetcode.com/eventfd"

# Main menu pages

[[params.menu]]
name = "articles"
url = "/articles"

[[params.menu]]
name = "posts"
url = "/posts"


# Syntax highlight on code blocks
[markup]
    [markup.highlight]
        noClasses = false
        lineNos = true
        lineNumbersInTable = false
        guessSyntax = true
    [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
            block = [['\[', '\]'], ['$$', '$$']]
            inline = [['\(', '\)'], ['$', '$']]
